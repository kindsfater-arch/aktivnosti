name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  apps-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверка секретов
        id: check
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -n "$CLASPRC" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::Секрет CLASPRC_JSON не задан — публикация в Apps Script пропущена"; fi
      - name: clasp push и обновление веб-приложения
        if: steps.check.outputs.ok == '1'
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          if [ -n "$SCRIPT_ID" ]; then
            printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json
          fi
          test -f .clasp.json || { echo "::error::Нет .clasp.json и переменной SCRIPT_ID"; exit 1; }
          clasp push -f
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy -i "$DEPLOYMENT_ID" -d "github ${GITHUB_SHA::7}"
          else
            echo "::warning::Переменная DEPLOYMENT_ID не задана — код загружен, но веб-приложение не переразвёрнуто"
          fi

  pages:
    if: vars.API_URL != ''
    needs: apps-script
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Сборка интерфейса
        env:
          API_URL: ${{ vars.API_URL }}
        run: bash scripts/build-web.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
